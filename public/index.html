<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Azure App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>My Azure App Ghubssss</h1>
  </header>

  <main>
    <section class="card">
      <h2>Add Item</h2>
      <form id="item-form">
        <input type="text" id="item-name" placeholder="Name" required />
        <input type="text" id="item-desc" placeholder="Description" />
        <button type="submit">Add</button>
      </form>
      <p id="form-message"></p>
    </section>

    <section class="card">
      <h2>Items</h2>
      <button id="load-btn">Load Items</button>
      <ul id="items-list"></ul>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
